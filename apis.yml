aid: trim
name: Trim
description: >-
  Trim is a consumer fintech company founded in 2015 that built an automated
  personal finance assistant which finds and cancels unwanted subscriptions,
  negotiates bills such as cable and internet, and automates savings for its
  users. Trim was backed by Version One Ventures and was acquired by OneMain
  Financial; its former asktrim.com home now redirects to OneMain MyMoney
  (onemainmymoney.com), where the product lives on as a personalized money
  insights and expense tracking app. Trim/MyMoney is a consumer application and
  does not publish a public developer API.
